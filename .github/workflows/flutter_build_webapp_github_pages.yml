name: Build and deploy flutter web app

on:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable  # 필요한 Flutter 채널을 선택하세요
          flutter-version: 3.24.0  # 필요한 Flutter 버전을 명시하세요

      - name: Install dependencies
        run: flutter pub get
        working-directory: ./side_project

      - name: Enable Flutter Web
        run: flutter config --enable-web

      - name: Build Flutter Web
        run: flutter build web --base-href "/${{ github.event.repository.name }}/"

      - name: Deploy to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add --all build/web
          git commit -m "Automatic deployment by GitHub Actions"
          git push origin HEAD:gh_pages --force
